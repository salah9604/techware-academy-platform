name: Deploy Techware Firestore Rules

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: 'Type techware-instructor to confirm the Firebase project'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: techware-firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy-rules:
    name: Publish Firestore rules only
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_project == 'techware-instructor' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check rules and project configuration
        run: |
          test -f firebase/firestore.rules
          test -f firebase.portal.json
          grep -q '"rules": "firebase/firestore.rules"' firebase.portal.json

      - name: Authenticate to Google Cloud (no stored keys)
        uses: google-github-actions/auth@v3
        with:
          project_id: techware-instructor
          workload_identity_provider: projects/257053522854/locations/global/workloadIdentityPools/techware-gha/providers/github-main
          service_account: techware-rules-deployer@techware-instructor.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Publish only Firestore security rules
        run: firebase deploy --only firestore:rules --config firebase.portal.json --project techware-instructor --non-interactive
